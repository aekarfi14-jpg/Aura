name: Unzip assets
on:
  push:
    paths:
      - 'assets.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract assets.zip
        run: |
          rm -rf assets
          mkdir -p assets_tmp
          unzip -o assets.zip -d assets_tmp
          if [ -d assets_tmp/assets ]; then
            mv assets_tmp/assets assets
          else
            mv assets_tmp assets
          fi
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Auto-extract assets.zip"
          git push
