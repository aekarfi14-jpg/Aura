<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>Aura Lens</title>
<style>
:root{
  --h:190;
  --c1:hsl(var(--h) 100% 62%);
  --c2:hsl(calc(var(--h) + 70) 100% 70%);
  --c3:hsl(calc(var(--h) + 140) 100% 68%);
  --ink:#060912;
  --glass:rgba(11,16,30,.62);
  --line:rgba(150,190,255,.16);
  --txt:#eaf1ff;
  --mut:#8b9bbb;
  --dir:1;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:ui-rounded,"SF Pro Rounded","SF Pro Display","Segoe UI Variable Display","Segoe UI","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html[dir=rtl]{--dir:-1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;background:#000}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stage .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,4,10,.62))}
#cam{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

/* ---------- shared ---------- */
.ui{position:fixed;z-index:10;transition:opacity .35s,transform .5s cubic-bezier(.2,.8,.2,1)}
body:not(.running) .ui{opacity:0;pointer-events:none}
body.focus .ui{opacity:0!important;pointer-events:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:0 14px 44px -14px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.07)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut);transition:.2s;position:relative;flex:none}
.ib:hover{color:var(--txt);background:rgba(255,255,255,.08)}
.ib.on{color:#04101a;background:linear-gradient(135deg,var(--c1),var(--c2))}
.bd{position:absolute;top:1px;inset-inline-end:0;min-width:16px;height:16px;border-radius:8px;background:var(--c3);color:#04101a;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px}
.bd.show{display:grid}

/* ---------- top bar ---------- */
#top{top:calc(12px + var(--safe-t));inset-inline:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px}
.brand{padding-inline-end:16px;font-weight:700;letter-spacing:.01em;font-size:15px;gap:10px}
.logo{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 20deg,var(--c1),var(--c2),var(--c3),var(--c1));position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#070b16}
.logo::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--c1);z-index:1;box-shadow:0 0 10px var(--c1)}
.stats{padding-inline:14px;gap:16px;font-size:12px;color:var(--mut);height:40px}
.stat{display:flex;gap:6px;align-items:center;white-space:nowrap}
.stat b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#3a4560;transition:.25s}
.dot.on{background:var(--c1);box-shadow:0 0 10px var(--c1)}

/* ---------- panels ---------- */
.panel{top:calc(72px + var(--safe-t));bottom:172px;width:296px;border-radius:24px;display:flex;flex-direction:column;overflow:hidden}
#legend{inset-inline-start:12px}
#settings{inset-inline-end:12px;width:310px}
body:not(.legend-open) #legend{transform:translateX(calc(var(--dir) * -118%));opacity:0;pointer-events:none}
body:not(.settings-open) #settings{transform:translateX(calc(var(--dir) * 118%));opacity:0;pointer-events:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:16px 12px 10px 16px;padding-inline:16px 10px}
.ph h2{margin:0;font-size:16px;font-weight:700}
.ph p{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--mut);max-width:210px}
#gList,.sbody{overflow-y:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.gcard{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:9px 12px 9px 9px;padding-inline:9px 12px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;transition:background .25s,border-color .25s,transform .25s,box-shadow .25s}
.ge{min-width:48px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:25px;background:rgba(255,255,255,.05);white-space:nowrap;padding-inline:4px}
.gt{display:flex;flex-direction:column;gap:2px;min-width:0}
.gt b{font-size:14px;font-weight:650}
.gt span{font-size:12px;color:var(--mut);line-height:1.4}
.gcard::after{content:"";position:absolute;bottom:0;inset-inline-start:0;height:3px;width:calc(var(--p,0) * 100%);background:linear-gradient(90deg,var(--c1),var(--c2))}
.gcard.active{border-color:var(--c1);background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 16%,transparent),rgba(255,255,255,.03));box-shadow:0 0 28px -8px var(--c1);transform:scale(1.015)}
.gcard.active .ge{background:linear-gradient(135deg,var(--c1),var(--c2))}
.gcard.hit{animation:hit .5s ease-out}
@keyframes hit{0%{box-shadow:0 0 0 0 var(--c1)}100%{box-shadow:0 0 0 18px transparent}}
#legend.dim #gList{opacity:.4}

/* ---------- settings ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);font-size:13.5px}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.row output{color:var(--c1);font-family:var(--mono);font-size:12px;margin-inline-start:6px}
.seg{display:flex;background:rgba(0,0,0,.35);border-radius:10px;padding:3px;gap:2px;direction:ltr}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;color:var(--mut);transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#04101a;font-weight:700}
.sw{position:relative;width:44px;height:26px;flex:none;direction:ltr}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:13px;background:rgba(255,255,255,.12);transition:.25s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+i{background:linear-gradient(135deg,var(--c1),var(--c2))}
.sw input:checked+i::after{transform:translateX(18px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.14);outline-offset:6px;direction:ltr}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 45%,transparent)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 45%,transparent)}
.hues{display:flex;gap:8px}
.hues button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:hsl(var(--x) 100% 62%);transition:.2s}
.hues button.on{border-color:#fff;transform:scale(1.12)}
.btn{padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.08);font-size:13.5px;font-weight:600;transition:.2s;text-align:center;text-decoration:none;color:var(--txt);display:inline-block}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.pri{background:linear-gradient(135deg,var(--c1),var(--c2));color:#04101a}

/* ---------- dock ---------- */
#dock{bottom:calc(12px + var(--safe-b));left:50%;width:min(700px,calc(100% - 24px));margin-inline:0;transform:translateX(-50%);border-radius:28px;padding:12px 14px 14px}
#chips{direction:ltr;position:relative;display:flex;gap:10px;overflow-x:auto;padding:6px 4px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--mut);transition:.25s}
.chip .sw2{width:52px;height:52px;border-radius:17px;border:1px solid rgba(255,255,255,.14);transition:.25s;position:relative}
.chip span{font-size:11.5px;white-space:nowrap;unicode-bidi:plaintext}
.chip.on{color:var(--txt)}
.chip.on .sw2{transform:translateY(-3px) scale(1.1);border-color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 55%,transparent),0 10px 26px -6px var(--c1)}
.chip:hover .sw2{transform:translateY(-2px)}
.mrow{display:flex;align-items:center;gap:14px;padding:4px 6px 0}
.mrow label{font-size:12.5px;color:var(--mut);min-width:44px}
#meter{flex:1;height:26px;position:relative;cursor:pointer;touch-action:none;direction:ltr;display:flex;align-items:center}
#meter .tr,#meter .fl{position:absolute;inset-inline:0;height:10px;border-radius:5px;-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 9px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 9px)}
#meter .tr{background:rgba(255,255,255,.14)}
#meter .fl{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));clip-path:inset(0 calc(100% - var(--v,0) * 100%) 0 0)}
#meterVal{width:44px;text-align:end;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.gh{font-size:20px;letter-spacing:2px;color:var(--mut)}

/* ---------- toast / countdown / rec / preview ---------- */
#toast{position:fixed;z-index:30;top:calc(96px + var(--safe-t));left:50%;transform:translate(-50%,-14px) scale(.92);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:12px 24px 12px 14px;padding-inline:14px 24px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 20px 60px -16px rgba(0,0,0,.7),0 0 40px -14px var(--c1);transition:opacity .3s,transform .4s cubic-bezier(.2,.9,.3,1.2)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.te{font-size:34px;line-height:1}
.tt{display:flex;flex-direction:column;gap:2px}
.tt b{font-size:17px}
.tt small{font-size:12.5px;color:var(--mut)}
#count{position:fixed;inset:0;z-index:40;display:none;place-items:center;pointer-events:none}
#count.on{display:grid}
.cn{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(6,9,18,.55),rgba(6,9,18,.2));border:2px solid var(--c1);box-shadow:0 0 70px -10px var(--c1),inset 0 0 50px -20px var(--c1);animation:cn 1s ease-out}
.cn b{font-size:130px;line-height:1;font-weight:800;background:linear-gradient(135deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
@keyframes cn{0%{transform:scale(1.35);opacity:0}18%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.86);opacity:0}}
#recPill{position:fixed;z-index:20;top:calc(72px + var(--safe-t));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;background:rgba(40,8,14,.7);border:1px solid rgba(255,80,110,.45);font-family:var(--mono);font-size:13px}
#recPill.on{display:flex}
#recPill i{width:9px;height:9px;border-radius:50%;background:#ff3d66;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#prevCard{position:fixed;z-index:25;inset-inline-end:16px;bottom:200px;width:132px;border-radius:18px;overflow:hidden;border:1px solid var(--c1);box-shadow:0 0 34px -8px var(--c1);transform:translateY(30px) scale(.9);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,.9,.3,1.2);background:#000;cursor:pointer}
#prevCard.show{transform:none;opacity:1;pointer-events:auto}
#prevCard img,#prevCard video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
#prevCard div{padding:7px 10px;font-size:12px;background:rgba(6,9,18,.85)}

/* ---------- gallery ---------- */
#gal{position:fixed;inset:0;z-index:70;background:rgba(4,6,12,.86);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);display:none;flex-direction:column}
#gal.on{display:flex}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + var(--safe-t)) 18px 12px;font-size:18px;font-weight:700}
#galGrid{flex:1;overflow-y:auto;padding:6px 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.gi{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#000;border:1px solid var(--line);cursor:pointer}
.gi img,.gi video{width:100%;height:100%;object-fit:cover;display:block}
.gi em{position:absolute;bottom:8px;inset-inline-start:8px;font-style:normal;font-size:11px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:8px}
#galEmpty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 20px;line-height:1.8}
#viewer{position:absolute;inset:0;background:rgba(3,5,10,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px}
#viewer.on{display:flex}
#vbody{max-width:100%;max-height:calc(100% - 80px);display:flex}
#vbody img,#vbody video{max-width:100%;max-height:calc(100vh - 150px);border-radius:16px;box-shadow:0 30px 80px -20px #000}
.vbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- start ---------- */
#start{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(70% 60% at 20% 15%,color-mix(in srgb,var(--c1) 22%,transparent),transparent 70%),radial-gradient(60% 55% at 85% 85%,color-mix(in srgb,var(--c3) 20%,transparent),transparent 70%),var(--ink);transition:opacity .7s,visibility .7s}
#start.hide{opacity:0;visibility:hidden;pointer-events:none}
.scard{width:min(460px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.orb{width:148px;height:148px;border-radius:50%;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c3),var(--c1));position:relative;animation:spin 9s linear infinite;box-shadow:0 0 90px -16px var(--c2)}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#101833,#060912 70%)}
.orb-in{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;z-index:2;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.scard h1{margin:0;font-size:46px;font-weight:800;letter-spacing:-.01em;background:linear-gradient(120deg,#fff 20%,var(--c1) 60%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.scard p{margin:0;color:var(--mut);line-height:1.7;font-size:15.5px;max-width:340px}
.ticker{display:flex;gap:10px;font-size:26px;flex-wrap:wrap;justify-content:center}
.ticker span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
#sbtn{padding:16px 40px;border-radius:18px;font-size:17px;font-weight:800;color:#04101a;background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:0 16px 44px -12px var(--c1);transition:.25s}
#sbtn:hover{transform:translateY(-2px);box-shadow:0 22px 54px -12px var(--c1)}
#sbtn:disabled{opacity:.6;transform:none}
#sst{font-size:13px;color:var(--mut);min-height:20px;line-height:1.6;max-width:360px}
#sst.bad{color:#ff8fa5}
.slang{position:absolute;top:calc(14px + var(--safe-t));inset-inline-end:14px}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .stats,.brand span{display:none}
  .brand{padding-inline-end:6px}
  #settings,#legend{width:auto}
  .panel{bottom:auto;top:calc(66px + var(--safe-t));max-height:calc(100% - 250px);width:auto;inset-inline:12px!important}
  #gList{display:grid;grid-template-columns:1fr 1fr}
  .gcard{grid-template-columns:1fr;gap:6px;padding:10px}
  .ge{width:100%}
  #dock{padding:10px 10px 12px;border-radius:24px}
  .chip{width:58px}.chip .sw2{width:46px;height:46px;border-radius:15px}
  #prevCard{bottom:170px;width:104px}
  #toast{top:auto;bottom:190px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>
  <div class="vig"></div>
  <video id="cam" playsinline muted autoplay></video>
</div>
<div id="flash"></div>

<!-- top bar -->
<header id="top" class="ui">
  <div class="pill glass brand"><i class="logo"></i><span>Aura Lens</span></div>
  <div class="pill glass stats">
    <div class="stat"><i class="dot" id="dHands"></i><span data-i18n="hands"></span><b id="nHands">0</b></div>
    <div class="stat"><span data-i18n="fps"></span><b id="nFps">0</b></div>
    <div class="stat"><span data-i18n="engine"></span><b id="nEng">…</b></div>
  </div>
  <div class="pill glass">
    <button class="ib" id="bLegend" aria-label="guide"><span style="font-size:19px">🖐️</span></button>
    <button class="ib" id="bGallery" aria-label="gallery"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-5-5L5 21"/></svg><span class="bd" id="gBadge">0</span></button>
    <button class="ib" id="bFlip" aria-label="flip"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg></button>
    <button class="ib" id="bSet" aria-label="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
    <button class="ib" id="bFull" aria-label="fullscreen"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
</header>

<!-- gesture guide -->
<aside id="legend" class="ui glass panel">
  <div class="ph"><div><h2 data-i18n="guide"></h2><p data-i18n="gtip"></p></div>
    <button class="ib" data-close="legend" aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="gList"></div>
</aside>

<!-- settings -->
<aside id="settings" class="ui glass panel">
  <div class="ph"><h2 data-i18n="settings"></h2>
    <button class="ib" data-close="settings" aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sbody">
    <div class="row"><span data-i18n="lang"></span><div class="seg" data-k="lang"><button data-v="ar">العربية</button><button data-v="en">English</button></div></div>
    <label class="row"><span data-i18n="gesturesOn"></span><span class="sw"><input type="checkbox" data-k="gestures"><i></i></span></label>
    <div class="row col"><span><span data-i18n="hold"></span><output data-o="hold"></output></span><input type="range" min="250" max="1400" step="50" data-k="hold"></div>
    <div class="row col"><span><span data-i18n="sens"></span><output data-o="sens"></output></span><input type="range" min="0.6" max="1.4" step="0.05" data-k="sens"></div>
    <div class="row"><span data-i18n="countdown"></span><div class="seg" data-k="countdown"><button data-v="0" data-i18n="off"></button><button data-v="3">3</button><button data-v="5">5</button></div></div>
    <div class="row"><span data-i18n="res"></span><div class="seg" data-k="res"><button data-v="480">480</button><button data-v="720">720</button><button data-v="1080">1080</button></div></div>

  o.connect(g);g.connect(AC.destination);o.start(tt);o.stop(tt+d+.03);
}

  const n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start();
}

/* ---------- WebGL filters ---------- */
const glc=$('#gl'),fxc=$('#fx'),fx=fxc.getContext('2d'),vid=$('#cam');
const gl=glc.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'})||glc.getContext('experimental-webgl');
const VS=`attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`;
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform float uAmt;
uniform float uMirror;
uniform int uFx;
varying vec2 vUv;

vec3 tex(vec2 u){ return texture2D(uTex, vec2(uMirror>.5 ? 1.-u.x : u.x, u.y)).rgb; }
float luma(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec3 pal(float t){ return .5+.5*cos(6.28318*(vec3(0.,.33,.67)+t)); }
vec3 heat(float t){
  vec3 c=mix(vec3(0.,0.,.18),vec3(.5,0.,.6),smoothstep(0.,.25,t));
  c=mix(c,vec3(1.,.1,.1),smoothstep(.25,.5,t));
  c=mix(c,vec3(1.,.8,0.),smoothstep(.5,.75,t));
  return mix(c,vec3(1.),smoothstep(.75,1.,t));
}
float edge(vec2 uv){
  vec2 px=1./uRes;
  float tl=luma(tex(uv+px*vec2(-1.,-1.)));
  float tt=luma(tex(uv+px*vec2(0.,-1.)));
  float tr=luma(tex(uv+px*vec2(1.,-1.)));
  float ll=luma(tex(uv+px*vec2(-1.,0.)));
  float rr=luma(tex(uv+px*vec2(1.,0.)));
  float bl=luma(tex(uv+px*vec2(-1.,1.)));
  float bb=luma(tex(uv+px*vec2(0.,1.)));
  float br=luma(tex(uv+px*vec2(1.,1.)));
  float gx=-tl-2.*ll-bl+tr+2.*rr+br;
  float gy=-tl-2.*tt-tr+bl+2.*bb+br;
  return length(vec2(gx,gy));
}
void main(){
  vec2 uv=vUv;
  float a=clamp(uAmt,0.,1.);
  float asp=uRes.x/uRes.y;
  vec3 src=tex(uv);
  vec3 col=src;
  if(uFx==1){                                   // Noir
    float l=smoothstep(.04,.96,luma(src));
    float n=(hash(uv*uRes+uTime)-.5)*.12;
    float v=1.-.55*smoothstep(.25,.95,length((uv-.5)*vec2(asp,1.)));
    col=mix(src,vec3(l+n)*v,a);
  } else if(uFx==2){                            // Neon edge
    float e=clamp(edge(uv)*2.2,0.,1.);
    vec3 neon=pal(uTime*.08+uv.x*.6+uv.y*.4)*e*1.8;
    col=mix(src,neon+src*.1,a);
  } else if(uFx==3){                            // Cyberpunk
    float ab=.005*a;
    vec3 c=vec3(tex(uv+vec2(ab,0.)).r,src.g,tex(uv-vec2(ab,0.)).b);
    float l=luma(c);
    vec3 tone=mix(vec3(.16,0.,.38),vec3(1.,.15,.65),smoothstep(0.,.5,l));
    tone=mix(tone,vec3(.1,.95,1.),smoothstep(.5,1.,l));
    vec3 r=mix(c,tone*(.55+.65*l)+c*.3,.88);
    float sc=.93+.07*sin(uv.y*uRes.y*1.6);
    col=mix(src,r*sc,a);
  } else if(uFx==4){                            // Thermal
    col=mix(src,heat(smoothstep(.05,.95,luma(src))),a);
  } else if(uFx==5){                            // VHS
    float tq=floor(uTime*12.);
    float jit=(hash(vec2(floor(uv.y*uRes.y/4.),tq))-.5)*.008*a*step(.985,hash(vec2(floor(uv.y*30.),tq)));
    float wob=sin(uv.y*30.+uTime*4.)*.0014*a;
    vec2 u2=uv+vec2(jit+wob,0.);
    float sh=.006*a;
    vec3 c=vec3(tex(u2+vec2(sh,0.)).r,tex(u2).g,tex(u2-vec2(sh,0.)).b);
    c=c*vec3(1.05,1.,1.12)+vec3(.02,0.,.04);
    float ln=.9+.1*sin(uv.y*uRes.y*1.6);
    float n=(hash(uv*uRes+uTime)-.5)*.16;
    float band=(1.-smoothstep(0.,.07,uv.y))*hash(vec2(floor(uv.x*40.),tq))*.6;
    col=mix(src,c*ln+n+band,a);
  } else if(uFx==6){                            // Pixel
    float sz=mix(1.,64.,a*a);
    vec2 g=(floor(uv*uRes/sz)+.5)*sz/uRes;
    vec3 c=floor(tex(g)*6.+.5)/6.;
    col=mix(src,c,min(a*4.,1.));
  } else if(uFx==7){                            // Glitch
    float tq=floor(uTime*8.);
    float rowId=floor(uv.y*14.);
    float blk=hash(vec2(rowId,tq));
    float hit=step(.82,blk);

function initGL(){
  if(!gl)throw new Error('WebGL unavailable');
  const mk=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};
  const p=gl.createProgram();

  gl.bindAttribLocation(p,0,'aPos');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  gl.useProgram(p);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

/* ---------- gesture classification ---------- */
function classify(l){
  const p=l.map(q=>[q.x*W,q.y*H]);
  const D=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const palm=D(p[0],p[9])||1;
  const thr=1.45+(1-S.sens)*.4;
  const ext=(tip,mcp)=>D(p[tip],p[0])/(D(p[mcp],p[0])||1)>thr;
  const i=ext(8,5),m=ext(12,9),r=ext(16,13),k=ext(20,17);
  const thumbOut=D(p[4],p[17])/(D(p[5],p[17])||1)>1.15+(1-S.sens)*.3;
  const tvx=p[4][0]-p[2][0],tvy=p[4][1]-p[2][1];
  const thumbUp=tvy<0&&-tvy>Math.abs(tvx)*1.3&&Math.hypot(tvx,tvy)>palm*.45&&p[4][1]<p[5][1]-palm*.1;
  const pinch=D(p[4],p[8])/palm<.3;
  const n=(m?1:0)+(r?1:0)+(k?1:0);
  if(pinch&&n>=2)return 'ok';
  if(!i&&!m&&!r&&!k){if(thumbUp)return 'thumb';if(thumbOut)return null;return 'fist'}
  if(!i&&!m&&!r&&k&&thumbOut)return 'shaka';
  if(i&&!m&&!r&&k)return thumbOut?'love':'rock';
  if(i&&m&&!r&&!k)return 'peace';
  if(!i&&m&&!r&&!k)return 'middle';
  if(i&&!m&&!r&&!k)return 'point';
  if(i&&m&&r&&k)return 'palm';
  return null;
}

/* ---------- state machine ---------- */
let hands=[],hg=[],lastVT=-1,lastTs=0,showOrig=false,busy=false,cool=0,lastActive=null,ok2Info=null;
let cand={id:null,since:0,last:0,fired:false,lastFire:0,hand:-1,p:0};
const GRACE=200,pulses=[];
const blank=()=>({id:null,since:0,last:0,fired:false,lastFire:0,hand:-1,p:0});
function detect(){
  if(!engine.lm||vid.currentTime===lastVT)return;
  lastVT=vid.currentTime;
  const ts=Math.max(lastTs+1,Math.round(performance.now()));lastTs=ts;
  try{hands=engine.lm.detectForVideo(vid,ts).landmarks||[]}catch(e){hands=[]}
}
function step(now){
  hg=hands.map(classify);
  let raw=null,rh=-1;
  if(S.gestures){
    if(hands.length>1&&hg[0]==='ok'&&hg[1]==='ok'){raw='ok2';rh=0}
    else for(let i=0;i<hg.length;i++){if(hg[i]&&hg[i]!=='ok'){raw=hg[i];rh=i;break}}
  }
  if(raw){
    if(raw!==cand.id){if(cand.id==='ok2')save();cand={...blank(),id:raw,since:now,last:now,hand:rh}}
    else{cand.last=now;cand.hand=rh}
  }else if(cand.id&&now-cand.last>GRACE){if(cand.id==='ok2')save();cand=blank()}
  showOrig=false;ok2Info=null;
  if(!cand.id){return}
  const g=GMAP[cand.id];
  if(g.cont){
    cand.p=(now-cand.since)/g.hold0;
    if(cand.p>=1){
      if(cand.id==='fist')showOrig=true;
      if(cand.id==='ok2'&&raw==='ok2'){
        const c=i=>[(hands[i][4].x+hands[i][8].x)/2*W,(hands[i][4].y+hands[i][8].y)/2*H];
        const a=c(0),b=c(1),d=Math.hypot(a[0]-b[0],a[1]-b[1])/W;
        const target=clamp((d-.10)/.45,0,1);
        S.amt=lerp(S.amt,target,.35);
        ok2Info={a:hands.map((_,i)=>i).slice(0,2)};
      }
    }
    return;
  }
  const rep=cand.fired&&g.repeat;
  const base=rep?cand.lastFire:cand.since,need=rep?g.repeat:S.hold*g.k;
  cand.p=cand.fired&&!g.repeat?1:(now-base)/need;
  if(cand.p<1||busy||now<cool)return;
  cand.fired=true;cand.lastFire=now;cool=now+300;
  const pts=hands[cand.hand];
  if(pts){const cx=(pts[0].x+pts[9].x)/2,cy=(pts[0].y+pts[9].y)/2;pulses.push({x:(effMirror()?1-cx:cx)*W,y:cy*H,t:now})}
  if(cards[g.id]){cards[g.id].classList.remove('hit');void cards[g.id].offsetWidth;cards[g.id].classList.add('hit')}
  sfx.fire();ACT[g.act]();
}

const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

  [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]].forEach(([x,y,sx,sy])=>{fx.moveTo(x,y+sy*len);fx.lineTo(x,y);fx.lineTo(x+sx*len,y)});
  fx.stroke();fx.restore();
}
function chip(text,x,y,col,u){

function drawFx(now){

    if(S.skeleton){

      fx.shadowColor=col;fx.shadowBlur=16*u;fx.strokeStyle=col;fx.lineWidth=2.6*u;
      fx.beginPath();CONN.forEach(([a,b])=>{fx.moveTo(pts[a][0],pts[a][1]);fx.lineTo(pts[b][0],pts[b][1])});fx.stroke();

      fx.restore();
    }
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    pts.forEach(q=>{x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});
    const pad=20*u;x0-=pad;y0-=pad;x1+=pad;y1+=pad;
    brackets(x0,y0,x1,y1,18*u,col,2.2*u);
    if(g){
      const nm=g==='ok'?t('needTwo'):GT[S.lang][g][0],em=g==='ok'?'👌':GMAP[g].e;
      chip(`${em}  ${nm}`,x0,y0-8*u,col,u);
    }
    if(cand.id&&cand.id!=='ok2'&&cand.hand===hi&&S.gestures){
      const cx=(pts[0][0]+pts[5][0]+pts[9][0]+pts[13][0]+pts[17][0])/5,cy=(pts[0][1]+pts[5][1]+pts[9][1]+pts[13][1]+pts[17][1])/5;
      const r=Math.hypot(pts[0][0]-pts[9][0],pts[0][1]-pts[9][1])*.85+16*u;
      ring(cx,cy,r,cand.p,col,u);
    }
  });

  if(P.length>1&&hg[0]==='ok'&&hg[1]==='ok'){
    const m=pts=>[(pts[4][0]+pts[8][0])/2,(pts[4][1]+pts[8][1])/2];
    const a=m(P[0]),b=m(P[1]),act=!!ok2Info,c1=acc(0),c2=acc(1);
    fx.save();fx.lineCap='round';
    const gr=fx.createLinearGradient(a[0],a[1],b[0],b[1]);gr.addColorStop(0,c1);gr.addColorStop(1,c2);
    fx.strokeStyle=gr;fx.shadowColor=c1;fx.shadowBlur=(act?22:6)*u;fx.lineWidth=(act?4:2)*u;
    if(!act)fx.setLineDash([10*u,10*u]);
    fx.beginPath();fx.moveTo(a[0],a[1]);fx.lineTo(b[0],b[1]);fx.stroke();fx.setLineDash([]);
    [a,b].forEach((q,i)=>{fx.strokeStyle=i?c2:c1;fx.lineWidth=3*u;fx.beginPath();fx.arc(q[0],q[1],20*u,0,6.2832);fx.stroke()});
    if(act){
      const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
      fx.shadowBlur=0;fx.fillStyle='rgba(6,10,20,.78)';rr(fx,mx-58*u,my-34*u,116*u,52*u,26*u);fx.fill();
      fx.strokeStyle=c1;fx.lineWidth=1.5*u;fx.stroke();
      fx.fillStyle='#fff';fx.font=`800 ${28*u}px ${FONT}`;fx.textAlign='center';fx.textBaseline='middle';
      fx.fillText(Math.round(S.amt*100)+'%',mx,my-7*u);
      fx.font=`600 ${11*u}px ${FONT}`;fx.fillStyle='#9fb2d6';fx.fillText(t('intn'),mx,my+12*u);
    }
    fx.restore();
  }

  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i],a=(now-p.t)/600;
    if(a>=1){pulses.splice(i,1);continue}
    fx.save();fx.strokeStyle=acc(0);fx.globalAlpha=1-a;fx.lineWidth=(6-4*a)*u;fx.shadowColor=acc(0);fx.shadowBlur=20*u;
    fx.beginPath();fx.arc(p.x,p.y,(50+a*130)*u,0,6.2832);fx.stroke();fx.restore();
  }
}

/* ---------- HUD ---------- */
let fpsN=0,fpsT=0,statT=0;
function hud(now){
  const id=cand.id&&S.gestures?cand.id:null;
  if(id!==lastActive){
    if(lastActive&&cards[lastActive]){cards[lastActive].classList.remove('active');cards[lastActive].style.setProperty('--p',0)}
    if(id&&cards[id])cards[id].classList.add('active');
    lastActive=id;
  }
  if(id&&cards[id])cards[id].style.setProperty('--p',clamp(cand.p,0,1));
  if(Math.abs(S.amt-shownAmt)>.003){
    shownAmt=S.amt;meter.style.setProperty('--v',S.amt);$('#meterVal').textContent=Math.round(S.amt*100)+'%';
  }
  fpsN++;
  if(now-fpsT>500){
    $('#nFps').textContent=Math.round(fpsN*1000/(now-fpsT));fpsN=0;fpsT=now;
    $('#nHands').textContent=hands.length;$('#dHands').classList.toggle('on',hands.length>0);
    $('#nEng').textContent=engine.lm?engine.src.toUpperCase():(engine.done?'OFF':'…');
  }
}

/* ---------- main loop ---------- */
function frame(now){
  requestAnimationFrame(frame);
  if(vid.readyState<2||!W||!glOK)return;
  detect();step(now);
  if(vid.currentTime!==texVT){texVT=vid.currentTime;gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid)}
  gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uTime,(now/1000)%1000);gl.uniform1f(U.uAmt,S.amt);
  gl.uniform1f(U.uMirror,effMirror()?1:0);gl.uniform1i(U.uFx,showOrig?0:S.filter);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  drawFx(now);hud(now);
}

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(!started||e.target.matches('input'))return;
  const k=e.key.toLowerCase();
  if(k==='arrowright'){ACT.next();e.preventDefault()}
  else if(k==='arrowleft'){ACT.prev()}
  else if(k===' '){ACT.photo();e.preventDefault()}
  else if(k==='r')ACT.rec();
  else if(k==='h')ACT.focus();
  else if(k==='g')$('#bLegend').click();
  else if(k==='s')$('#bSet').click();
  else if(k==='escape'){body.classList.remove('focus');$('#galClose').click()}
});

/* ---------- boot ---------- */
const sst=$('#sst'),sbtn=$('#sbtn');
let stKey='',stBad=false;
function setStatus(key,bad){stKey=key;stBad=!!bad;sst.className=bad?'bad':'';sst.innerHTML=key?t(key):''}
syncSettings();applyLang();updateBadge();
try{initGL()}catch(e){console.error(e);setStatus('',true);sst.textContent='WebGL: '+e.message;sst.className='bad'}
const SWOK='serviceWorker' in navigator&&/^https?:$/.test(location.protocol);
if(SWOK)navigator.serviceWorker.register('./sw.js').catch(()=>{});
async function checkOffline(n=0){
  try{
    if(!SWOK||!window.caches||n>15)return;
    const hit=await caches.match(MODEL_CDN);
    if(started||(stKey!=='ok_engine'&&stKey!=='cdn_note'))return;
    if(hit)setStatus('offline_ready');else setTimeout(()=>checkOffline(n+1),2500);
  }catch(e){}
}
setStatus('ld_engine');
engine.p=loadEngine().then(r=>{engine.lm=r.lm;engine.src=r.src;engine.done=true;if(!started)setStatus(r.src==='cdn'&&!SWOK?'cdn_note':'ok_engine');checkOffline()})
  .catch(e=>{console.warn(e);engine.err=e;engine.done=true;if(!started)setStatus('bad_engine',true)});
sbtn.onclick=async()=>{
  if(!glOK)return;
  initAudio();sbtn.disabled=true;setStatus('ld_cam');
  try{await startCam()}catch(e){console.error(e);setStatus(e&&e.ctx?'bad_ctx':'bad_cam',true);sbtn.disabled=false;return}
  started=true;body.classList.add('running');
  if(innerWidth>900)body.classList.add('legend-open');
  $('#start').classList.add('hide');
  requestAnimationFrame(frame);
  markChips(true);
  toast('👋',t('welcome'),t('welcomeSub'));sfx.ok();
};
</script>
